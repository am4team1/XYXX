<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XYXX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#050a1c; --surface:#0b1330; --surface-2:#101b42; --fg:#e9eeff; --muted:#8c9bc8; --line:#1d2b5c;
  --gold:#ecb953; --blue:#4a76ff; --heart:#ff5d7a; --danger:#ff5d7a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(1200px 520px at 50% -120px,#17307a 0%,rgba(23,48,122,0) 70%);background-repeat:no-repeat;background-attachment:fixed;color:var(--fg);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.7;padding-inline:16px;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
img{max-width:100%;display:block}
a{color:var(--gold);text-decoration:none}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1100px;margin-inline:auto}

/* ============ Login ============ */
.login-screen{position:fixed;inset:0;z-index:100;background:var(--bg);background-image:radial-gradient(900px 500px at 50% 0%,#17307a 0%,rgba(23,48,122,0) 70%);display:grid;place-items:center;padding:20px;overflow-y:auto}
.card{width:min(100%,420px);background:linear-gradient(135deg,var(--surface-2),var(--surface));border:1px solid var(--gold);border-radius:18px;padding:36px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(236,185,83,.12)}
.logo-mark{font-weight:700;font-size:62px;letter-spacing:.12em;margin:0;color:#f4f7ff;text-shadow:0 0 40px rgba(74,118,255,.65)}
.logo-mark span{color:var(--gold);text-shadow:0 0 36px rgba(236,185,83,.7)}
.orn{display:flex;align-items:center;gap:12px;color:var(--gold);width:min(100%,300px);margin:14px auto 18px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{background:linear-gradient(270deg,transparent,var(--gold))}
.orn i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.sub{font-size:17px;color:#c9d4ff;margin:0 0 28px}
.login-actions{display:grid;gap:12px}
.login-actions button{padding:13px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:16px;transition:.15s}
.login-actions button:hover{transform:translateY(-2px);border-color:var(--gold)}
.login-actions .primary{background:var(--gold);color:#1b1402;border-color:var(--gold)}
.login-foot{margin-top:22px;color:var(--muted);font-size:12px}

.admin-login{width:min(100%,420px);background:linear-gradient(135deg,var(--surface-2),var(--surface));border:1px solid var(--gold);border-radius:18px;padding:30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.admin-login h2{margin:0 0 6px;text-align:center;font-size:22px}
.admin-login p.hint{color:var(--muted);font-size:13px;text-align:center;margin:0 0 22px}
.field{display:grid;gap:6px;margin-block-end:12px}
.field>label{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:15px;font-family:inherit;color:var(--fg);width:100%}
.field textarea{min-height:200px;resize:vertical;line-height:1.9;font-size:16px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.admin-login .actions{display:grid;gap:10px;margin-top:18px}
.admin-login .actions button{padding:12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.admin-login .actions .primary{background:var(--gold);color:#1b1402;border-color:var(--gold)}
.err{color:var(--danger);font-size:13px;text-align:center;margin-top:8px;min-height:18px}

/* ============ Header ============ */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:20px;letter-spacing:.22em;direction:ltr}
.logo b{color:var(--gold)}
.top nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center}
.top nav a{color:var(--muted);font-size:15px;padding:6px 16px;border-radius:999px;font-weight:500}
.top nav a:hover{color:var(--fg);background:var(--surface)}
.userbar{display:flex;gap:6px;align-items:center}
.userbar .tag{font-size:12px;color:var(--muted);padding:5px 12px;border:1px solid var(--line);border-radius:999px}
.userbar button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.userbar button:hover{color:var(--fg);border-color:var(--gold)}
.userbar .admin-btn{background:var(--gold);color:#1b1402;border-color:var(--gold);font-weight:600}

/* ============ Hero ============ */
.hero{padding-block:56px 40px;text-align:center;display:grid;gap:14px;justify-items:center}
.mark-hero{font-weight:700;font-size:clamp(72px,18vw,150px);line-height:.95;letter-spacing:.08em;margin:0;direction:ltr;color:#f4f7ff;text-shadow:0 0 40px rgba(74,118,255,.6),0 0 120px rgba(74,118,255,.3)}
.mark-hero span{color:var(--gold);text-shadow:0 0 36px rgba(236,185,83,.7)}
.tag-hero{font-size:clamp(16px,2.4vw,19px);color:#c9d4ff;margin:0;letter-spacing:.02em}

/* ============ Sections ============ */
.section{margin-block-end:60px;scroll-margin-top:20px}
.sec-head{display:flex;align-items:center;gap:14px;margin-block-end:22px}
.sec-head h2{margin:0;font-size:clamp(22px,3.6vw,30px);font-weight:700}
.sec-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec-head .count{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:28px 18px}
.item{display:flex;flex-direction:column;gap:10px;min-width:0}
.open{all:unset;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0}
.open:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:10px}
.cvbox{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--surface);border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s}
.item.vid .cvbox{aspect-ratio:16/9}
.cv{display:block;width:100%;height:100%;object-fit:cover}
.open:hover .cvbox{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 16px 34px rgba(0,0,0,.55),0 0 24px rgba(236,185,83,.2)}
.cvbox .badges{position:absolute;top:10px;inset-inline-start:10px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:0 9px;line-height:22px;letter-spacing:.02em}
.badge.ex-b{background:var(--gold);color:#1b1402}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.5))}
.play i{width:56px;height:56px;border-radius:50%;background:rgba(236,185,83,.95);display:grid;place-items:center;box-shadow:0 0 26px rgba(236,185,83,.55)}
.play i::after{content:"";display:block;width:0;height:0;border-inline-start:16px solid #1b1402;border-block:10px solid transparent;margin-inline-start:4px}
.dur{position:absolute;bottom:10px;inset-inline-end:10px;background:rgba(5,10,28,.9);border:1px solid var(--line);border-radius:5px;font-size:12px;padding:1px 8px;font-variant-numeric:tabular-nums}
.item h3{margin:0;font-size:17px;font-weight:600;line-height:1.5;text-wrap:balance}
.item .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:44px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;font-size:15px;line-height:1.8}
.empty strong{display:block;color:var(--fg);font-size:17px;margin-bottom:4px;font-weight:600}

/* ============ Like ============ */
.like{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px 2px 10px;cursor:pointer;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.like:hover{border-color:var(--heart);color:var(--fg)}
.like svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;transition:transform .15s}
.like[aria-pressed="true"]{color:var(--heart);border-color:var(--heart);background:rgba(255,93,122,.1)}
.like[aria-pressed="true"] svg{fill:var(--heart);stroke:var(--heart)}
.like.pop svg{transform:scale(1.4)}

/* ============ Footer ============ */
footer{border-top:1px solid var(--line);padding-block:24px 60px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

/* ============ Toast ============ */
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:200;margin-inline:auto;width:fit-content;max-width:100%;background:var(--surface-2);border:1px solid var(--gold);border-radius:12px;padding:10px 20px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.55)}

/* ============ Reader ============ */
.reader{position:fixed;inset:0;z-index:30;background:var(--bg);background-image:radial-gradient(900px 400px at 50% -100px,#17307a 0%,rgba(23,48,122,0) 70%);background-repeat:no-repeat;overflow-y:auto;padding-inline:16px}
.reader-bar{position:sticky;top:0;background:rgba(5,10,28,.93);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);z-index:2}
.rb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 16px;cursor:pointer;font-size:14px}
.rb:hover{border-color:var(--gold)}
.rb:disabled{opacity:.3;cursor:default}
.sizes{display:flex;gap:6px}
.piece{max-width:680px;margin-inline:auto;padding-block:32px 80px}
.piece h2{margin:0 0 8px;font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.35;text-wrap:balance;text-align:center}
.banner{width:100%;max-width:520px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid var(--line);margin-inline:auto;margin-block-end:24px}
.pmeta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin-block-end:32px;padding-block-end:20px;border-bottom:1px solid var(--line)}
.body{font-size:var(--rs,20px);line-height:2.1;text-align:center;color:#e6ecff}
.body p{margin:0 0 1.6em}
.body p span{display:block}
.end{text-align:center;color:var(--gold);letter-spacing:.8em;margin-block:32px;font-size:14px}

/* ============ Video Modal ============ */
.vmodal{position:fixed;inset:0;z-index:30;background:rgba(2,5,15,.96);backdrop-filter:blur(10px);overflow-y:auto;padding:16px}
.vmodal-bar{max-width:1100px;margin-inline:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:6px 14px}
.vstage{max-width:1100px;margin-inline:auto;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.vstage iframe,.vstage video{width:100%;height:100%;border:0;display:block}
.vinfo{max-width:1100px;margin-inline:auto;padding-block:20px 60px}
.vinfo h2{margin:0 0 12px;font-size:clamp(20px,3.4vw,28px);font-weight:700;line-height:1.35}
.vinfo .pmeta{justify-content:flex-start;margin-block-end:0;border-bottom:0;padding-block-end:0}
.vinfo p.desc{font-size:16px;line-height:1.9;color:#c9d4ff;margin-block:16px 0}

/* ============ Admin Panel ============ */
.admin-panel{position:fixed;inset:0;z-index:50;background:var(--bg);background-image:radial-gradient(900px 400px at 50% -100px,#17307a 0%,rgba(23,48,122,0) 70%);background-repeat:no-repeat;overflow-y:auto;padding-inline:16px}
.ap-bar{position:sticky;top:0;background:rgba(5,10,28,.95);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:14px;border-bottom:1px solid var(--line);z-index:2;flex-wrap:wrap}
.ap-bar h1{margin:0;font-size:19px;font-weight:700}
.ap-bar h1 span{color:var(--gold)}
.ap-body{max-width:820px;margin-inline:auto;padding-block:24px 100px;display:grid;gap:18px}
.ap-tabs{display:flex;gap:8px;flex-wrap:wrap}
.ap-tabs button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 22px;font-size:15px;color:var(--muted);cursor:pointer;font-weight:500}
.ap-tabs button[aria-pressed="true"]{background:var(--gold);color:#1b1402;border-color:var(--gold);font-weight:700}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 18px;cursor:pointer;font-size:14px;color:var(--muted)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1b1402;font-weight:600}

.checkline{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-size:15px}
.checkline input{accent-color:var(--gold);width:18px;height:18px;cursor:pointer}

.actions{display:flex;gap:10px;flex-wrap:wrap;padding-block:8px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 26px;cursor:pointer;font-weight:600;font-size:15px;transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1b1402;border-color:var(--gold)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:rgba(255,93,122,.1)}

.ap-list{display:grid;gap:12px}
.entry{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.entry .thumb{width:48px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--surface-2)}
.entry.vid .thumb{width:88px;height:50px}
.entry .info{flex:1;min-width:0}
.entry h4{margin:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry small{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.entry .acts{display:flex;gap:6px;flex-shrink:0}
.entry .acts button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500}
.entry .acts button:hover{color:var(--fg);border-color:var(--gold)}
.entry .acts button.del:hover{color:var(--danger);border-color:var(--danger)}

.hint{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px 18px;color:var(--muted);font-size:13px;line-height:1.8}
.hint b{color:var(--gold)}
.row-space{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Image picker */
.img-picker{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.img-picker-preview{aspect-ratio:3/4;max-width:180px;background:var(--surface-2);border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px}
.img-picker-preview img{width:100%;height:100%;object-fit:cover}
.img-picker-actions{display:flex;gap:8px;flex-wrap:wrap}
.img-picker-actions .btn{padding:8px 18px;font-size:13px}

@media (prefers-reduced-motion:reduce){.cvbox,.like svg,.login-actions button,.open:hover .cvbox{transition:none;transform:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<!-- ============ Login ============ -->
<div class="login-screen" id="loginScreen">
  <div id="loginChoice">
    <div class="card">
      <h1 class="logo-mark">X<span>Y</span>XX</h1>
      <div class="orn"><i></i></div>
      <p class="sub">حيث تبدأ الحكايات</p>
      <div class="login-actions">
        <button class="primary" id="btnGuest" type="button">تسجيل الدخول</button>
        <button id="btnAdmin" type="button">تسجيل كأدمن</button>
      </div>
      <p class="login-foot">الحساب العادي بيدخّلك على الموقع مباشرة.</p>
    </div>
  </div>
  <div id="loginAdmin" hidden>
    <div class="admin-login">
      <h2>دخول الأدمن</h2>
      <p class="hint">أدخل بيانات المشرف للوصول للوحة التحكم.</p>
      <form id="adminForm" autocomplete="off">
        <div class="field">
          <label for="aUser">اسم المستخدم</label>
          <input id="aUser" type="text" required autocomplete="off" dir="ltr">
        </div>
        <div class="field">
          <label for="aPass">كلمة المرور</label>
          <input id="aPass" type="password" required autocomplete="off" dir="ltr">
        </div>
        <div class="err" id="aErr"></div>
        <div class="actions">
          <button class="primary" type="submit">دخول</button>
          <button type="button" id="aBack">رجوع</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ============ Site ============ -->
<div id="site" hidden>
  <div class="wrap">
    <header class="top">
      <div class="logo">XY<b>X</b>X</div>
      <nav>
        <a href="#sec-stories">القصص</a>
        <a href="#sec-poems">شعر</a>
        <a href="#sec-videos">فيديوهات</a>
      </nav>
      <div class="userbar" id="userbar"></div>
    </header>

    <section class="hero">
      <h1 class="mark-hero" aria-label="XYXX">X<span>Y</span>XX</h1>
      <p class="tag-hero">حيث تبدأ الحكايات</p>
    </section>

    <section class="section" id="sec-stories">
      <div class="sec-head">
        <h2>القصص</h2>
        <span class="line"></span>
        <span class="count" id="cnt-stories">0</span>
      </div>
      <div class="grid" id="grid-stories"></div>
    </section>

    <section class="section" id="sec-poems">
      <div class="sec-head">
        <h2>شعر</h2>
        <span class="line"></span>
        <span class="count" id="cnt-poems">0</span>
      </div>
      <div class="grid" id="grid-poems"></div>
    </section>

    <section class="section" id="sec-videos">
      <div class="sec-head">
        <h2>فيديوهات</h2>
        <span class="line"></span>
        <span class="count" id="cnt-videos">0</span>
      </div>
      <div class="grid" id="grid-videos"></div>
    </section>
  </div>
  <footer class="wrap">
    <span>XYXX © <span id="yr"></span></span>
    <span>كل المحتوى محفوظ على هذا الجهاز — استخدم النسخ الاحتياطي لنقله.</span>
  </footer>
</div>

<!-- ============ Admin Panel ============ -->
<div class="admin-panel" id="adminPanel" hidden>
  <div class="ap-bar">
    <h1>لوحة <span>الأدمن</span></h1>
    <div class="sizes">
      <button class="rb" id="apBack" type="button">رجوع للموقع</button>
      <button class="rb" id="apLogout" type="button">خروج</button>
    </div>
  </div>
  <div class="ap-body" id="apBody"></div>
</div>

<!-- ============ Reader ============ -->
<div class="reader" id="reader" hidden role="dialog" aria-modal="true">
  <div class="reader-bar">
    <button class="rb" id="rdClose" type="button">رجوع</button>
    <div class="sizes">
      <button class="rb" id="rdMinus" type="button">أ−</button>
      <button class="rb" id="rdPlus" type="button">أ+</button>
    </div>
  </div>
  <article class="piece" id="piece"></article>
</div>

<!-- ============ Video Modal ============ -->
<div class="vmodal" id="vmodal" hidden role="dialog" aria-modal="true">
  <div class="vmodal-bar">
    <button class="rb" id="vmClose" type="button">رجوع</button>
    <div class="sizes">
      <button class="rb" id="vmPrev" type="button">→ السابق</button>
      <button class="rb" id="vmNext" type="button">التالي ←</button>
    </div>
  </div>
  <div class="vstage" id="vstage"></div>
  <div class="vinfo" id="vinfo"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ==================================================================
   بيانات الأدمن — غيّرها من هنا
   ================================================================== */
const ADMIN_USER = 'xyxx_admin_root';
const ADMIN_PASS = 'Xy#9Kx$2026!Admin@Z7';

/* ==================================================================
   تخزين
   ================================================================== */
const LS_CONTENT = 'xyxx-content-v5';
const LS_LIKES   = 'xyxx-likes-v5';
const LS_SESSION = 'xyxx-session-v5';

let CONTENT = { stories: [], poems: [], videos: [] };
let SESSION = { role: null, ts: 0 };
let LIKES = new Set();

function loadAll(){
  try{ const r = localStorage.getItem(LS_CONTENT); if(r){ const d = JSON.parse(r);
    if(Array.isArray(d.stories)) CONTENT.stories = d.stories;
    if(Array.isArray(d.poems))   CONTENT.poems   = d.poems;
    if(Array.isArray(d.videos))  CONTENT.videos  = d.videos;
  }}catch(e){ console.warn('load content', e); }
  try{ const r = localStorage.getItem(LS_LIKES); if(r) LIKES = new Set(JSON.parse(r)); }catch(e){}
  try{ const r = localStorage.getItem(LS_SESSION); if(r){ const s = JSON.parse(r); if(s && s.role) SESSION = s; } }catch(e){}
}
function saveContent(){
  try{
    localStorage.setItem(LS_CONTENT, JSON.stringify(CONTENT));
    return true;
  }catch(e){
    toast('تعذّر الحفظ — المحتوى كبير. جرّب صور أصغر أو رابط بدل رفع ملف.');
    return false;
  }
}
function saveLikes(){ try{ localStorage.setItem(LS_LIKES, JSON.stringify([...LIKES])); }catch(e){} }
function saveSession(){ try{ localStorage.setItem(LS_SESSION, JSON.stringify(SESSION)); }catch(e){} }

/* ==================================================================
   أدوات

const $ = s => document.querySelector(s);
const ar = new Intl.NumberFormat('ar-EG');
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function fmtDate(d){ if(!d) return ''; try{ return new Date(d+'T00:00:00').toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'}); }catch(e){ return d; } }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
let toastT; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden = true, 3200); }
const isAdmin = () => SESSION.role === 'admin';

/* ==================================================================
   غلاف بديل (لو مفيش صورة)
   ================================================================== */
const phCache = {};
function placeholderCover(item){
  const key = item.id || item.title || 'x';
  if(phCache[key]) return phCache[key];
  const hue = item.hue || 225;
  const letter = (String(item.title||'?').trim().charAt(0) || '?').toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="hsl(${hue},65%,12%)"/>
<stop offset="1" stop-color="hsl(${hue+25},70%,28%)"/>
</linearGradient></defs>
<rect width="300" height="400" fill="url(#g)"/>
<circle cx="150" cy="200" r="110" fill="hsl(${hue},60%,35%)" opacity=".28"/>
<text x="150" y="240" text-anchor="middle" font-family="sans-serif" font-size="140" font-weight="700" fill="#ecb953" opacity=".55">${letter}</text>
<rect x="9" y="9" width="282" height="382" rx="4" fill="none" stroke="#ecb953" stroke-opacity=".35" stroke-width="1"/>
</svg>`;
  return (phCache[key] = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg));
}
const ytThumb = id => `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
function coverOf(item){
  if(item.cover) return item.cover;
  if(item.kind === 'youtube' && item.yt) return ytThumb(item.yt);
  return placeholderCover(item);
}
function coverImg(item, cls){
  const i = el('img', cls || 'cv');
  i.src = coverOf(item); i.alt = 'غلاف ' + (item.title || ''); i.loading = 'lazy';
  i.addEventListener('error', () => { i.src = placeholderCover(item); }, { once: true });
  return i;
}
function clearPhCache(){ Object.keys(phCache).forEach(k => delete phCache[k]); }

/* ==================================================================
   ضغط الصور
   ================================================================== */
function readFileAsDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function compressImage(file, maxW = 800, quality = 0.85){
  const dataUrl = await readFileAsDataURL(file);
  return await new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      try{ res(c.toDataURL('image/jpeg', quality)); }catch(e){ res(dataUrl); }
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.8 8.2 2.9 4.5 6.5 4.5c2 0 3.7 1.1 5.5 3.2 1.8-2.1 3.5-3.2 5.5-3.2 3.6 0 5.7 3.7 4.1 7.2C19.5 16.4 12 21 12 21z" stroke-linejoin="round"/></svg>';
function likeBtn(item){
  const b = el('button','like'); b.type = 'button';
  const on = LIKES.has(item.id);
  b.setAttribute('aria-pressed', on);
  b.innerHTML = HEART + '<span class="n">' + (on?1:0) + '</span>';
  b.addEventListener('click', e => {
    e.stopPropagation();
    const was = LIKES.has(item.id);
    if(was) LIKES.delete(item.id); else LIKES.add(item.id);
    if(!was){ b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 180); }
    saveLikes();
    b.setAttribute('aria-pressed', LIKES.has(item.id));
    b.querySelector('.n').textContent = LIKES.has(item.id) ? 1 : 0;
  });
  return b;
}

  $('#site').hidden = true;
  $('#adminPanel').hidden = true;
  $('#loginChoice').hidden = false;
  $('#loginAdmin').hidden = true;
}

}

}

});
$('#btnAdmin').addEventListener('click', () => {

function renderUserBar(){
  const bar = $('#userbar'); bar.replaceChildren();
  if(isAdmin()){
    const t = el('span','tag','أدمن');
    const b1 = el('button','admin-btn','لوحة التحكم'); b1.type = 'button';
    b1.addEventListener('click', showAdminPanel);
    const b2 = el('button', null, 'خروج'); b2.type = 'button';
    b2.addEventListener('click', () => { SESSION = {role:'guest',ts:Date.now()}; saveSession(); showLogin(); });
    bar.append(t, b1, b2);
  } else {
    const t = el('span','tag','ضيف');
    const b = el('button', null, 'خروج'); b.type = 'button';
    b.addEventListener('click', () => { SESSION = {role:null,ts:0}; saveSession(); showLogin(); });
    bar.append(t, b);
  }
}

/* ==================================================================
   رسم الموقع
   ================================================================== */
const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '');

function renderAll(){
  clearPhCache();
  renderSection('#grid-stories', '#cnt-stories', CONTENT.stories, 'story');
  renderSection('#grid-poems', '#cnt-poems', CONTENT.poems, 'poem');
  renderSection('#grid-videos', '#cnt-videos', CONTENT.videos, 'video');
}

function renderSection(gridSel, cntSel, items, type){
  const grid = $(gridSel), cnt = $(cntSel);
  grid.replaceChildren();
  const sorted = [...items].sort(byDateDesc);
  cnt.textContent = ar.format(sorted.length);
  if(!sorted.length){
    const e = el('div','empty');
    e.innerHTML = '<strong>مفيش محتوى هنا لسه</strong>الأدمن يقدر يرفع أول عنصر من لوحة التحكم.';
    grid.append(e); return;
  }
  sorted.forEach((item, i) => {
    if(type === 'video') grid.append(videoCard(item, i, sorted));
    else grid.append(textCard(item, type));
  });
}

function textCard(item, type){
  const it = el('div','item');
  const o = el('button','open'); o.type = 'button';
  const bx = el('div','cvbox');
  bx.append(coverImg(item));
  if(item.exclusive){
    const bg = el('div','badges'); bg.append(el('span','badge ex-b','حصري')); bx.append(bg);
  }
  o.append(bx, el('h3', null, item.title || 'بدون عنوان'));
  o.addEventListener('click', () => openReader(item, type));
  const foot = el('div','foot');
  const lines = type === 'poem'
    ? ar.format((item.body||[]).flat().length) + ' سطر'
    : ar.format((item.body||[]).length) + ' فقرة';
  foot.append(likeBtn(item), el('span', null, lines));
  it.append(o, foot);
  return it;
}

function videoCard(v, i, list){
  const it = el('div','item vid');
  const o = el('button','open'); o.type = 'button';
  const bx = el('div','cvbox');
  bx.append(coverImg(v));
  const pl = el('div','play'); pl.append(el('i')); bx.append(pl);
  if(v.dur) bx.append(el('span','dur', v.dur));
  if(v.exclusive){
    const bg = el('div','badges'); bg.append(el('span','badge ex-b','حصري')); bx.append(bg);
  }
  o.append(bx, el('h3', null, v.title || 'بدون عنوان'));
  o.addEventListener('click', () => openVideo(list, i));
  const foot = el('div','foot');
  foot.append(likeBtn(v), el('span', null, fmtDate(v.date)));
  it.append(o, foot);
  return it;
}

let readerSize = 20;
$('#rdPlus').addEventListener('click', () => { readerSize = Math.min(32, readerSize + 2); $('#reader').style.setProperty('--rs', readerSize + 'px'); });
$('#rdMinus').addEventListener('click', () => { readerSize = Math.max(16, readerSize - 2); $('#reader').style.setProperty('--rs', readerSize + 'px'); });
$('#rdClose').addEventListener('click', closeReader);
function closeReader(){ $('#reader').hidden = true; document.body.style.overflow = ''; }

function openReader(item, type){
  const a = $('#piece'); a.replaceChildren();
  if(item.cover) a.append(coverImg(item, 'banner'));
  a.append(el('h2', null, item.title || 'بدون عنوان'));
  const m = el('div','pmeta');
  if(item.exclusive) m.append(el('span','badge ex-b','حصري'));
  m.append(el('span', null, fmtDate(item.date)), likeBtn(item));
  a.append(m);
  const b = el('div','body');
  if(type === 'poem'){
    (item.body || []).forEach(stanza => {
      const s = el('p');
      stanza.forEach(line => s.append(el('span', null, line)));
      b.append(s);
    });
  } else {
    (item.body || []).forEach(par => b.append(el('p', null, par)));
  }
  a.append(b, el('div','end','✦ ✦ ✦'));
  $('#reader').hidden = false; $('#reader').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

/* ==================================================================
   مشغل الفيديو
   ================================================================== */
$('#vmClose').addEventListener('click', closeVideo);
function closeVideo(){ $('#vstage').replaceChildren(); $('#vmodal').hidden = true; document.body.style.overflow = ''; }

let videoList = [], videoIdx = 0;
function openVideo(list, idx){
  videoList = list; videoIdx = idx;
  const v = list[idx]; if(!v) return;
  const stage = $('#vstage'); stage.replaceChildren();
  if(v.kind === 'youtube' && v.yt){
    const f = el('iframe');
    f.src = `https://www.youtube-nocookie.com/embed/${v.yt}?autoplay=1&rel=0`;
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    f.allowFullscreen = true; f.title = v.title || '';
    stage.append(f);
  } else if(v.kind === 'file' && v.src){
    const vd = el('video'); vd.src = v.src; vd.controls = true; vd.autoplay = true; vd.playsInline = true;
    if(v.poster) vd.poster = v.poster;
    stage.append(vd);
  } else {
    stage.append(el('p','empty','مصدر الفيديو غير صالح.'));
  }
  const info = $('#vinfo'); info.replaceChildren();
  info.append(el('h2', null, v.title || 'بدون عنوان'));
  const m = el('div','pmeta');
  if(v.exclusive) m.append(el('span','badge ex-b','حصري'));
  m.append(el('span', null, fmtDate(v.date)), likeBtn(v));
  info.append(m);
  if(v.desc) info.append(el('p','desc', v.desc));

  $('#vmPrev').disabled = idx === 0;
  $('#vmNext').disabled = idx === list.length - 1;
  $('#vmPrev').onclick = () => openVideo(list, idx - 1);
  $('#vmNext').onclick = () => openVideo(list, idx + 1);

  $('#vmodal').hidden = false; $('#vmodal').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

/* ==================================================================
   لوحة الأدمن
   ================================================================== */
let apTab = 'stories';
let apView = 'list';
let apForm = null;

$('#apBack').addEventListener('click', () => { renderAll(); showSite(); });
$('#apLogout').addEventListener('click', () => {
  SESSION = { role:null, ts:0 }; saveSession(); showLogin();
});

function apGoList(){ apView = 'list'; apForm = null; renderAp(); }

function renderAp(){
  const b = $('#apBody'); b.replaceChildren();
  if(apView === 'list') apList(b); else apFormView(b);
}

function apList(b){
  const row = el('div','row-space');
  const tabs = el('div','ap-tabs');
  [['stories','القصص'],['poems','شعر'],['videos','فيديوهات']].forEach(([k, l]) => {
    const btn = el('button', null, l); btn.type = 'button';
    btn.setAttribute('aria-pressed', apTab === k);
    btn.addEventListener('click', () => { apTab = k; apGoList(); });
    tabs.append(btn);
  });
  row.append(tabs);
  const addBtn = el('button','btn primary', '+ إضافة جديد'); addBtn.type = 'button';
  addBtn.addEventListener('click', () => { apForm = apNewItem(apTab); apView = 'form'; renderAp(); });
  row.append(addBtn);
  b.append(row);

  const hint = el('div','hint');
  hint.innerHTML = 'كل المحتوى محفوظ في هذا المتصفح. اضغط <b>تصدير نسخة</b> بانتظام للاحتفاظ بالنسخة الاحتياطية، واستخدم <b>استيراد</b> على جهاز آخر.';
  b.append(hint);

  const tools = el('div','actions');
  const exp = el('button','btn','تصدير نسخة'); exp.type = 'button'; exp.addEventListener('click', apExport);
  const imp = el('button','btn','استيراد نسخة'); imp.type = 'button'; imp.addEventListener('click', apImport);
  tools.append(exp, imp);
  b.append(tools);

  const list = el('div','ap-list');
  const items = CONTENT[apTab];
  const sorted = [...items].sort(byDateDesc);
  if(!sorted.length){
    const e = el('div','empty');
    e.innerHTML = '<strong>مفيش عناصر لسه</strong>اضغط «إضافة جديد» لرفع أول عنصر.';
    list.append(e);
  } else {
    sorted.forEach(item => list.append(apEntry(item)));
  }
  b.append(list);
}

function apEntry(item){
  const isVid = apTab === 'videos';
  const e = el('div','entry' + (isVid ? ' vid' : ''));
  const img = el('img','thumb'); img.src = coverOf(item); img.alt = '';
  const info = el('div','info');
  info.append(el('h4', null, item.title || 'بدون عنوان'));
  const meta = el('small');
  meta.append(el('span', null, fmtDate(item.date)));
  meta.append(el('span','badge ' + (item.exclusive ? 'ex-b' : 'kind-b'), item.exclusive ? 'حصري' : 'عادي'));
  info.append(meta);
  const acts = el('div','acts');
  const ed = el('button', null, 'تعديل'); ed.type = 'button';
  ed.addEventListener('click', () => { apForm = apPrepareEdit(item, apTab); apView = 'form'; renderAp(); });
  const dl = el('button','del','حذف'); dl.type = 'button';
  dl.addEventListener('click', () => {
    if(!confirm('متأكد من حذف «' + (item.title || 'بدون عنوان') + '»؟')) return;
    CONTENT[apTab] = CONTENT[apTab].filter(x => x.id !== item.id);
    if(saveContent()){ toast('تم الحذف'); }
    apGoList();
  });
  acts.append(ed, dl);
  e.append(img, info, acts);
  return e;
}

function apNewItem(tab){
  const today = new Date().toISOString().slice(0,10);
  if(tab === 'videos'){
    return { id: uid('v'), kind:'youtube', yt:'', src:'', poster:'', cover:'', title:'', date: today, dur:'', desc:'', exclusive: false, _new: true };
  }
  return { id: uid(tab === 'stories' ? 's' : 'p'), title:'', date: today, cover:'', exclusive: false, _new: true, _body: '' };
}

function apPrepareEdit(item, tab){
  const c = { ...item, _new: false };
  if(tab === 'poems'){
    c._body = (item.body || []).map(st => st.join('\n')).join('\n\n');
  } else if(tab === 'stories'){
    c._body = (item.body || []).join('\n\n');
  }
  return c;
}

function parseStoryBody(text){
  const t = String(text || '').trim();
  if(!t) return [];
  let blocks = t.split(/\n\s*\n+/).map(s => s.trim()).filter(Boolean);
  if(blocks.length === 1){
    const lines = t.split('\n').map(s => s.trim()).filter(Boolean);
    if(lines.length > 1) blocks = lines;
  }
  return blocks;
}

function parsePoemBody(text){
  const blocks = String(text || '').split(/\n\s*\n+/).map(s => s.trim()).filter(Boolean);
  return blocks
    .map(b => b.split('\n').map(l => l.trim()).filter(Boolean))
    .filter(a => a.length);
}

function apFormView(b){
  const isVid = apTab === 'videos';
  const isPoem = apTab === 'poems';
  const titleTxt = (apForm._new ? 'إضافة ' : 'تعديل ') + (isVid ? 'فيديو' : isPoem ? 'قصيدة' : 'قصة');
  b.append(el('h2', { className: 'sec-head' } ) && (() => { const h = el('h2'); h.textContent = titleTxt; return h; })());

  b.append(apField('العنوان', apInput(apForm.title || '', v => apForm.title = v, 'اكتب عنوان واضح')));

  const dateRow = el('div'); dateRow.style.maxWidth = '220px';
  dateRow.append(apField('التاريخ', apInputDate(apForm.date || '', v => apForm.date = v)));
  b.append(dateRow);

  if(isVid){
    const kinds = el('div','chips');
    [['youtube','يوتيوب'],['file','ملف مباشر / رابط']].forEach(([k, l]) => {
      const c = el('button','chip', l); c.type = 'button';
      c.setAttribute('aria-pressed', apForm.kind === k);
      c.addEventListener('click', () => { apForm.kind = k; renderAp(); });
      kinds.append(c);
    });
    b.append(apField('نوع المصدر', kinds));

    if(apForm.kind === 'youtube'){
      b.append(apField('معرّف الفيديو على يوتيوب', apInput(apForm.yt || '', v => apForm.yt = v, 'مثال: aqz-KE-bpKQ')));
    } else {
      b.append(apField('رابط الملف', apInput(apForm.src || '', v => apForm.src = v, 'مثال: videos/clip.mp4')));
    }
    b.append(apField('المدة (اختياري)', apInput(apForm.dur || '', v => apForm.dur = v, 'مثال: 5:20')));
    b.append(apField('الوصف (اختياري)', apTextarea(apForm.desc || '', v => apForm.desc = v, 4, 'سطر أو سطرين...')));
  } else {
    const ph = isPoem
      ? 'كل بيت في سطر. اترك سطر فاضي للفصل بين المقاطع.'
      : 'كل فقرة في سطر. اترك سطر فاضي للفصل بين الفقرات.';
    b.append(apField('النص', apTextarea(apForm._body || '', v => apForm._body = v, 18, ph)));
  }

  b.append(apField('صورة الغلاف', createImagePicker(
    apForm.cover || apForm.poster || '',
    v => { apForm.cover = v; if(isVid) apForm.poster = v; },
    isVid
  )));

  const chk = el('label','checkline');
  const box = document.createElement('input'); box.type = 'checkbox'; box.checked = !!apForm.exclusive;
  box.addEventListener('change', () => { apForm.exclusive = box.checked; });
  chk.append(box, document.createTextNode(' حصري على XYXX'));
  b.append(chk);

  const acts = el('div','actions');
  const save = el('button','btn primary','حفظ'); save.type = 'button';
  save.addEventListener('click', () => apSave(isVid, isPoem));
  const cancel = el('button','btn','إلغاء'); cancel.type = 'button';
  cancel.addEventListener('click', apGoList);
  acts.append(save, cancel);

  if(!apForm._new){
    const del = el('button','btn danger','حذف'); del.type = 'button';
    del.addEventListener('click', () => {
      if(!confirm('متأكد من الحذف؟')) return;
      CONTENT[apTab] = CONTENT[apTab].filter(x => x.id !== apForm.id);
      if(saveContent()){ toast('تم الحذف'); }
      apGoList();
    });
    acts.append(del);
  }
  b.append(acts);
}

function apSave(isVid, isPoem){
  if(!String(apForm.title || '').trim()){ toast('العنوان مطلوب'); return; }

  let item;
  if(isVid){
    if(apForm.kind === 'youtube' && !String(apForm.yt || '').trim()){ toast('معرّف اليوتيوب مطلوب'); return; }
    if(apForm.kind === 'file' && !String(apForm.src || '').trim()){ toast('رابط الملف مطلوب'); return; }
    item = {
      id: apForm.id,
      kind: apForm.kind,
      yt: apForm.yt || '',
      src: apForm.src || '',
      poster: apForm.poster || apForm.cover || '',
      cover: apForm.cover || apForm.poster || '',
      title: apForm.title.trim(),
      date: apForm.date,
      dur: apForm.dur || '',
      desc: apForm.desc || '',
      exclusive: !!apForm.exclusive
    };
  } else {
    const body = isPoem ? parsePoemBody(apForm._body) : parseStoryBody(apForm._body);
    if(!body.length){ toast('النص مطلوب'); return; }
    item = {
      id: apForm.id,
      title: apForm.title.trim(),
      date: apForm.date,
      cover: apForm.cover || '',
      exclusive: !!apForm.exclusive,
      body
    };
  }
  const i = CONTENT[apTab].findIndex(x => x.id === item.id);
  if(i > -1) CONTENT[apTab][i] = item; else CONTENT[apTab].unshift(item);
  if(!saveContent()) return;
  toast('تم الحفظ بنجاح');
  apGoList();
}

/* ==================================================================
   نموذج رفع الصورة
   ================================================================== */
function createImagePicker(currentValue, onChange, isVideo){
  const wrap = el('div','img-picker');
  const preview = el('div','img-picker-preview');
  if(isVideo) preview.style.aspectRatio = '16/9';

  let value = currentValue || '';
  const updatePreview = () => {
    preview.replaceChildren();
    if(value){
      const img = el('img'); img.src = value; img.alt = '';
      img.addEventListener('error', () => { preview.replaceChildren(el('span', null, 'الصورة مش ظاهرة')); }, { once: true });
      preview.append(img);
    } else {
      preview.append(el('span', null, 'مفيش صورة'));
    }
  };

  const fileBtn = el('button','btn','رفع من الجهاز'); fileBtn.type = 'button';
  fileBtn.addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0]; if(!f) return;
      if(f.size > 6 * 1024 * 1024){ toast('الصورة كبيرة (أكبر من 6 ميجا)'); return; }
      try{
        const compressed = await compressImage(f, 900, 0.82);
        value = compressed; onChange(value); updatePreview();
        toast('تم رفع الصورة');
      }catch(e){ toast('تعذّر رفع الصورة'); }
    });
    inp.click();
  });

  const urlBtn = el('button','btn','رابط صورة'); urlBtn.type = 'button';
  urlBtn.addEventListener('click', () => {
    const isData = value && value.startsWith('data:');
    const url = prompt('الصق رابط الصورة:', isData ? '' : value);
    if(url !== null){ value = url.trim(); onChange(value); updatePreview(); }
  });

  const clearBtn = el('button','btn danger','إزالة'); clearBtn.type = 'button';
  clearBtn.addEventListener('click', () => { value = ''; onChange(''); updatePreview(); });

  const actions = el('div','img-picker-actions');
  actions.append(fileBtn, urlBtn, clearBtn);

  wrap.append(preview, actions);
  updatePreview();
  return wrap;
}

/* ==================================================================

function apField(label, control){
  const f = el('div','field');
  f.append(el('label', null, label), control);
  return f;
}
function apInput(value, oninput, ph){
  const i = document.createElement('input'); i.type = 'text'; i.value = value || '';
  if(ph) i.placeholder = ph;
  i.addEventListener('input', () => oninput(i.value));
  return i;
}
function apInputDate(value, oninput){
  const i = document.createElement('input'); i.type = 'date'; i.value = value || '';
  i.addEventListener('input', () => oninput(i.value));
  return i;
}
function apTextarea(value, oninput, rows, ph){
  const t = document.createElement('textarea'); t.value = value || ''; t.rows = rows || 6;
  if(ph) t.placeholder = ph;
  t.addEventListener('input', () => oninput(t.value));
  return t;
}

/* ==================================================================
   تصدير / استيراد
   ================================================================== */
function apExport(){
  const data = JSON.stringify({ stories: CONTENT.stories, poems: CONTENT.poems, videos: CONTENT.videos, likes: [...LIKES] }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'xyxx-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('تم تنزيل النسخة الاحتياطية');
}
function apImport(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    try{
      const d = JSON.parse(await f.text());
      if(Array.isArray(d.stories)) CONTENT.stories = d.stories;
      if(Array.isArray(d.poems))   CONTENT.poems   = d.poems;
      if(Array.isArray(d.videos))  CONTENT.videos  = d.videos;
      if(Array.isArray(d.likes)){ LIKES = new Set(d.likes); saveLikes(); }
      if(saveContent()){ toast('تم الاستيراد بنجاح'); }
      renderAll();
      apGoList();
    }catch(e){ toast('ملف غير صالح'); }
  });
  inp.click();
}

/* ==================================================================
   نجوم
   ================================================================== */
function rng(s){ let h = 1779033703 ^ s.length; for(let i=0;i<s.length;i++){ h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } let a = h; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function stars(){
  const c = $('#stars'), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const x = c.getContext('2d'); x.setTransform(1,0,0,1,0,0); x.scale(dpr, dpr);
  x.clearRect(0, 0, innerWidth, innerHeight);
  const r = rng('xyxx-sky'); const n = Math.round(innerWidth * innerHeight / 6500);
  for(let i = 0; i < n; i++){
    x.globalAlpha = r() * .6 + .1;
    x.fillStyle = r() > .85 ? '#ecb953' : '#cfdcff';
    x.beginPath(); x.arc(r() * innerWidth, r() * innerHeight, r() * 1.2 + .2, 0, 6.283); x.fill();
  }
}
stars();
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(stars, 200); });
